<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .container {
            display: list-item;

        }

        .wrapper {
            margin-top: 70px;
            width: 60%;
            height: 9000px;
            display: flex;
            border: 1px solid black;
        }

        .content {
            background-color: red;
            width: 50%;
            height: 9100px;
        }

        .schedule {
            background-color: yellow;
            top: 0;
            width: 100px;
            height: 100px;
            position: sticky;
            left: 90%;
        }

        .footer {
            background-color: bisque;
            top: 20%;
            left: 20%;
            width: 60%;
            height: 9000px;
            display: flex;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="wrapper">
            <div class="content">

            </div>
            <div class="schedule">

            </div>
        </div>
        <div class="footer"></div>
    </div>


</body>

</html>
